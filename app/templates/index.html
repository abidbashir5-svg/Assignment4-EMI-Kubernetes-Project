<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .card { border: 0; box-shadow: 0 8px 24px rgba(25, 45, 75, .08); }
    .result-value { font-size: 1.35rem; font-weight: 700; }
    #message { min-height: 24px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container"><span class="navbar-brand mb-0 h1">Loan EMI Calculator</span></div>
</nav>
<main class="container py-4">
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card p-4">
        <h2 class="h4 mb-3">Calculate your monthly instalment</h2>
        <form id="emi-form">
          <div class="mb-3">
            <label for="principal" class="form-label">Loan amount (P)</label>
            <input class="form-control" id="principal" name="principal" type="number" min="0.01" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="rate" class="form-label">Annual interest rate (%)</label>
            <input class="form-control" id="rate" name="rate" type="number" min="0.01" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="months" class="form-label">Tenure (months)</label>
            <input class="form-control" id="months" name="months" type="number" min="1" step="1" required>
          </div>
          <button class="btn btn-primary w-100" id="calculate-btn" type="submit">Calculate EMI</button>
        </form>
        <div id="message" class="small mt-3" role="status"></div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card p-4 h-100">
        <h2 class="h4 mb-3">Calculation result</h2>
        <div id="empty-result" class="text-secondary">Enter the loan details and select Calculate EMI.</div>
        <div id="result-panel" class="d-none">
          <div class="row g-3">
            <div class="col-md-4"><div class="text-secondary small">Monthly EMI</div><div class="result-value text-primary" id="emi-result">—</div></div>
            <div class="col-md-4"><div class="text-secondary small">Total payment</div><div class="result-value" id="payment-result">—</div></div>
            <div class="col-md-4"><div class="text-secondary small">Total interest</div><div class="result-value" id="interest-result">—</div></div>
          </div>
          <hr>
          <div class="small text-secondary">Request served by</div>
          <div id="served-by" class="small"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card p-4 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Recent calculation history</h2>
      <button class="btn btn-outline-secondary btn-sm" id="refresh-history" type="button">Refresh</button>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead><tr><th>Loan amount</th><th>Rate (%)</th><th>Months</th><th>EMI</th><th>Served by</th><th>Created</th></tr></thead>
        <tbody id="history-body"><tr><td colspan="6" class="text-secondary">Loading history…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  function money(value) {
    return new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
  }

  function loadHistory() {
    $.getJSON('/api/history')
      .done(function(rows) {
        const body = $('#history-body').empty();
        if (!rows.length) {
          body.append('<tr><td colspan="6" class="text-secondary">No calculations stored yet.</td></tr>');
          return;
        }
        rows.forEach(function(row) {
          const served = row.servedBy ? `${row.servedBy.name} (${row.servedBy.ip})` : '';
          const created = row.createdAt ? new Date(row.createdAt).toLocaleString() : '';
          const tr = $('<tr>');
          [money(row.principal), row.rate, row.months, money(row.emi), served, created].forEach(function(value) {
            $('<td>').text(value).appendTo(tr);
          });
          body.append(tr);
        });
      })
      .fail(function() {
        $('#history-body').html('<tr><td colspan="6" class="text-danger">Could not load history. Check MongoDB connection.</td></tr>');
      });
  }

  $('#emi-form').on('submit', function(event) {
    event.preventDefault(); // AJAX submission: no page reload/postback
    const payload = {
      principal: $('#principal').val(),
      rate: $('#rate').val(),
      months: $('#months').val()
    };
    $('#calculate-btn').prop('disabled', true);
    $('#message').removeClass('text-danger text-success').text('Calculating…');
    $.ajax({
      url: '/api/emi', method: 'POST', contentType: 'application/json', data: JSON.stringify(payload)
    }).done(function(data) {
      $('#emi-result').text(money(data.emi));
      $('#payment-result').text(money(data.totalPayment));
      $('#interest-result').text(money(data.totalInterest));
      $('#served-by').text(`${data.servedBy.name} • ${data.servedBy.ip}`);
      $('#empty-result').addClass('d-none');
      $('#result-panel').removeClass('d-none');
      $('#message').addClass('text-success').text('Calculation saved successfully.');
      loadHistory();
    }).fail(function(xhr) {
      const message = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : 'Calculation failed. Check the application and MongoDB.';
      $('#message').addClass('text-danger').text(message);
    }).always(function() {
      $('#calculate-btn').prop('disabled', false);
    });
  });

  $('#refresh-history').on('click', loadHistory);
  $(loadHistory);
</script>
</body>
</html>
