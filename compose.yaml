services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  emi-web:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URL: mongodb://mongo:27017/emi_db
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
